services:
  pos-db:
    image: postgres:16-alpine
    container_name: pos-db
    restart: always
    environment:
      POSTGRES_USER: posuser
      POSTGRES_PASSWORD: pospassword
      POSTGRES_DB: pos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posuser -d pos_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pos-network

  pos-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://posuser:pospassword@pos-db:5432/pos_db
      - POSTGRES_HOST=pos-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=posuser
      - POSTGRES_PASSWORD=pospassword
      - POSTGRES_DB=pos_db
      - NODE_ENV=production
    depends_on:
      pos-db:
        condition: service_healthy
    networks:
      - pos-network

  pos-adminer:
    image: adminer:latest
    container_name: pos-adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: pos-db
    depends_on:
      - pos-db
    networks:
      - pos-network

volumes:
  pgdata:
    driver: local

networks:
  pos-network:
    driver: bridge
